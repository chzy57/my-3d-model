<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei",system-ui,sans-serif; background:#0a0e1a; color:#e0e0e0; overflow:auto; touch-action:auto; }
.header { background:linear-gradient(135deg,#c62828,#6a1b1a); padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }

.main { display:flex; height:calc(100vh - 88px); }
.sidebar { width:170px; background:#111827; padding:8px; border-right:1px solid #374151; overflow-y:auto; }

.sidebar button { width:100%; padding:8px 7px; margin-bottom:4px; background:#1f2937; color:#e0e0e0; border:1px solid #374151; border-radius:6px; cursor:pointer; font-size:12px; text-align:left; }

#quizBtn { width:100%; padding:8px 7px; margin-bottom:4px; background:#1f2937; color:#ff9800; border:1px solid #ff9800; border-radius:6px; cursor:pointer; font-size:12px; text-align:left; font-weight:bold; transition:all .2s; }
#quizBtn:hover { background:rgba(255,152,0,.15); }
#uploadModelBtn { width:100%; padding:8px 7px; margin-bottom:4px; background:#1f2937; color:#4fc3f7; border:1px solid #4fc3f7; border-radius:6px; cursor:pointer; font-size:12px; text-align:left; transition:all .2s; }
#uploadModelBtn:hover { background:rgba(79,195,247,.15); }
#clearModelBtn { width:100%; padding:6px 7px; margin-bottom:4px; background:#1f2937; color:#f44336; border:1px solid #f44336; border-radius:6px; cursor:pointer; font-size:11px; text-align:left; transition:all .2s; display:none; }
#clearModelBtn:hover { background:rgba(244,67,54,.15); }
#uploadSmearBtn { width:100%; padding:8px 7px; margin-bottom:4px; background:#1f2937; color:#66bb6a; border:1px solid #66bb6a; border-radius:6px; cursor:pointer; font-size:12px; text-align:left; transition:all .2s; }
#uploadSmearBtn:hover { background:rgba(102,187,106,.15); }
#clearSmearBtn { width:100%; padding:6px 7px; margin-bottom:4px; background:#1f2937; color:#f44336; border:1px solid #f44336; border-radius:6px; cursor:pointer; font-size:11px; text-align:left; transition:all .2s; display:none; }
#clearSmearBtn:hover { background:rgba(244,67,54,.15); }
.local-tag { color:#ff4444; font-size:10px; margin-left:4px; }
.folder-tag { color:#4fc3f7; font-size:10px; margin-left:4px; }
.viewer { flex:1; position:relative; overflow:hidden; }
#threeContainer { position:absolute; inset:0; touch-action:none; }

#labelLayer { position:absolute; inset:0; pointer-events:none; touch-action:none; }
.tag3d { pointer-events:auto; touch-action:auto; cursor:grab; background:rgba(0,0,0,.88); border:1.5px solid #ef5350; color:#fff; padding:3px 9px; border-radius:6px; font-size:11px; transform:translate(-50%,-50%); white-space:nowrap; user-select:none; box-shadow:0 2px 8px rgba(0,0,0,.5); }
.tag3d.drag { cursor:grabbing; box-shadow:0 4px 16px rgba(239,83,80,.5); z-index:100; }
.info { width:318px; background:#111827; padding:10px; border-left:1px solid #374151; overflow-y:auto; }
.info h3 { color:#ef5350; font-size:15px; margin-bottom:5px; }
.info p { font-size:11px; line-height:1.55; color:#b0bec5; margin-bottom:5px; }
.tag { display:inline-block; background:#c62828; color:#fff; font-size:9px; padding:1px 5px; border-radius:3px; margin:0 2px 2px 0; }
.dim { background:#1565c0; color:#90caf9; font-size:10px; padding:6px 8px; border-radius:6px; margin-top:6px; line-height:1.6; }
.dim b { color:#e3f2fd; font-weight:600; }
.dim .k { color:#bbdefb; opacity:.85; }
.sec { margin-top:8px; border-top:1px solid #2b3648; padding-top:7px; }
.sec-h { font-size:11px; font-weight:bold; margin-bottom:3px; letter-spacing:.3px; }
.sec-b { font-size:11px; line-height:1.7; color:#cfd8dc; text-align:justify; }
.nl { margin:0 0 6px; padding-left:14px; text-indent:-14px; }
.nl-lead { margin:0 0 5px; color:#eceff1; font-weight:600; }
.nl-flat { margin:0 0 5px; }
.nl-flat:last-child { margin-bottom:0; }
.nl:last-child { margin-bottom:0; }
#labelDetail .nl { margin-bottom:4px; }
.sec.morph .sec-h { color:#81d4fa; }
.sec.stain .sec-h { color:#ce93d8; }
.sec.diff .sec-h { color:#fff59d; }
.sec.clin .sec-h { color:#a5d6a7; }
.sec.case .sec-h { color:#ffab91; }
.sec.lab .sec-h { color:#80cbc4; }
.sec.morph { border-left:2px solid #81d4fa; padding-left:6px; }
.sec.stain { border-left:2px solid #ce93d8; padding-left:6px; }
.sec.diff { border-left:2px solid #fff59d; padding-left:6px; }
.sec.clin { border-left:2px solid #a5d6a7; padding-left:6px; }
.sec.case { border-left:2px solid #ffab91; padding-left:6px; }
.sec.lab { border-left:2px solid #80cbc4; padding-left:6px; }
.case-tag { display:inline-block; background:#3e2723; color:#ffab91; font-size:9px; padding:1px 5px; border-radius:3px; margin-right:4px; }
.lab-note { margin-top:5px; font-size:9px; color:#78909c; line-height:1.5; border-top:1px dashed #374151; padding-top:4px; }
.smear { margin-top:8px; border-top:1px solid #374151; padding-top:8px; }
.smear h4 { color:#ff9800; font-size:11px; margin-bottom:5px; }
.smear img { width:100%; border-radius:7px; border:1px solid #374151; min-height:110px; object-fit:cover; background:#000; }
.smear .err { width:100%; min-height:110px; border:1px dashed #374151; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#6b7280; font-size:10px; text-align:center; padding:10px; }
.smear .note { font-size:10px; color:#90caf9; margin-top:4px; line-height:1.4; }
.bottom { height:42px; background:#111827; border-top:1px solid #374151; display:flex; gap:8px; align-items:center; justify-content:center; }
.bottom button { padding:5px 11px; border-radius:6px; border:1px solid #374151; background:#1f2937; color:#e0e0e0; font-size:11px; cursor:pointer; }
.bottom button:hover { background:#c62828; color:#fff; }
.bottom button.active { background:#ff9800; color:#fff; border-color:#ff9800; }
.mode-label { position:absolute; top:8px; right:8px; background:rgba(198,40,40,.85); color:#fff; padding:3px 9px; border-radius:11px; font-size:10px; pointer-events:none; }
#errBanner { display:none; position:fixed; top:0; left:0; right:0; background:#c62828; color:#fff; padding:8px; font-size:11px; z-index:9999; text-align:center; }
#loadingBanner { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.85); color:#4fc3f7; padding:20px 30px; border-radius:10px; font-size:14px; z-index:9998; border:1px solid #4fc3f7; }
#quizPanel { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#111827; border:2px solid #ff9800; border-radius:12px; padding:20px; width:90%; max-width:460px; z-index:5000; box-shadow:0 0 40px rgba(255,152,0,.3); transition: all 0.3s ease; }
#quizPanel.dragging { transition:none; cursor:grabbing; }
#quizPanelDragHandle { position:absolute; top:26px; left:12px; right:12px; height:20px; cursor:pointer; z-index:2; }
#quizPanelDragHandle::after { content:"单击折叠/展开"; color:#6b7280; font-size:9px; letter-spacing:1px; }
#quizPanel h3 { color:#ff9800; margin-bottom:4px; font-size:15px; text-align:center; }
#quizProgress { font-size:11px; color:#9ca3af; margin-bottom:10px; text-align:center; }
#quizCellName { font-size:16px; font-weight:bold; text-align:center; margin-bottom:14px; color:#fff; }
#quizOptions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.quizOpt { padding:10px 8px; border:1px solid #374151; border-radius:8px; background:#1f2937; color:#e0e0e0; cursor:pointer; font-size:12px; transition:all 0.2s; text-align:center; }
.quizOpt:hover { border-color:#ff9800; }
.quizOpt.correct { background:rgba(76,175,80,.3); border-color:#4CAF50; color:#4CAF50; }
.quizOpt.wrong { background:rgba(244,67,54,.3); border-color:#f44336; color:#f44336; }
.quizOpt:disabled { cursor:default; opacity:0.7; }
#quizResult { text-align:center; margin-top:10px; }
#quizResult button { margin:5px; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:12px; border:none; }
#quizClose { position:absolute; top:8px; right:12px; background:none; border:none; color:#9ca3af; font-size:16px; cursor:pointer; }
/* ===== 作业署名标识：右下角半透明浮层，不拦截3D操作 ===== */
#hwBadge { position:absolute; right:12px; bottom:12px; z-index:2500; pointer-events:none;
  background:rgba(17,24,39,.5); border:1px solid rgba(255,255,255,.16); border-radius:9px;
  padding:7px 13px; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  text-align:right; user-select:none; box-shadow:0 2px 10px rgba(0,0,0,.35);
  transition:opacity .25s; max-width:60%; }
#hwBadge .hw-name { font-size:12px; color:#fff; font-weight:700; letter-spacing:.6px; line-height:1.35; }
#hwBadge .hw-sub  { font-size:9px; color:#9ca3af; margin-top:2px; letter-spacing:.3px; line-height:1.35; }
#hwBadge .hw-x { position:absolute; top:-7px; right:-7px; width:17px; height:17px; line-height:15px;
  border-radius:50%; background:#374151; color:#9ca3af; font-size:10px; text-align:center;
  cursor:pointer; pointer-events:auto; border:1px solid #4b5563; transition:all .18s; }
#hwBadge .hw-x:hover { background:#c62828; color:#fff; border-color:#c62828; }
/* 折叠态：缩成右下角小圆点，点击可随时恢复，绝不会消失丢失 */
#hwBadge.collapsed { padding:0; width:22px; height:22px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; pointer-events:auto; background:rgba(17,24,39,.45);
  transition:all .2s; }
#hwBadge.collapsed:hover { background:rgba(198,40,40,.85); border-color:#c62828; }
#hwBadge.collapsed .hw-name, #hwBadge.collapsed .hw-sub, #hwBadge.collapsed .hw-x { display:none; }
#hwBadge.collapsed::after { content:'\1F9E0'; font-size:11px; line-height:1; opacity:.9; }
#hwBadge.hidden { display:none; }
@media print { #hwBadge { background:rgba(17,24,39,.92); } #hwBadge .hw-x { display:none; }
  #hwBadge.collapsed { display:none; } }
#labelDetail { display:none; position:fixed; background:#1f2937; border:1px solid #ef5350; border-radius:8px; padding:12px; width:268px; z-index:3000; box-shadow:0 4px 16px rgba(0,0,0,.6); pointer-events:auto; }
#labelDetail h4 { margin-bottom:6px; color:#ef5350; font-size:13px; }
#labelDetail p { font-size:11px; margin:3px 0; line-height:1.7; color:#cfd8dc; text-align:justify; }
#detailFoot { margin-top:8px; padding-top:6px; border-top:1px solid #374151; font-size:10px; color:#90a4ae; line-height:1.5; }
#labelDetail .close { position:absolute; top:4px; right:8px; cursor:pointer; font-size:13px; color:#9ca3af; }
@media(max-width:768px){ .sidebar{width:140px;} .info{width:246px;} #quizOptions{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div id="errBanner"></div>
<div id="loadingBanner">⏳ 加载中...</div>

<div class="header">
  <div>
	<h1 data-i18n="app_title">🩸 血细胞3D形态教学 v18</h1>
	<p data-i18n="app_sub">16种细胞·可拖拽标注·中/英双语·镜下对照·测验·文件夹模型·自定义涂片·病例与检验要点</p>
  </div>
  <div class="toolbar">
	<button id="btn3d" class="active" onclick="setMode('3d')" data-i18n="mode_3d">🧊 立体</button>
	<button id="btnLabels" class="active" onclick="toggleLabels()" data-i18n="labels_on">🏷 标注</button>
	<button id="btnRotateTop" onclick="toggleRotate()" class="active">🔄 自动旋转</button>
	<button id="btnSpeech" onclick="toggleSpeech()">🔇 静音</button>
	<select id="langSel" onchange="setLang(this.value)">
	  <option value="zh">中文</option>
	  <option value="en">English</option>
		</select>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
	<button id="quizBtn" onclick="startQuiz()">📋 测验模式</button>
	<button id="uploadModelBtn" onclick="triggerUpload()">📤 上传本细胞3D模型<span class="local-tag">（仅本机）</span></button>
	<input id="modelFile" type="file" accept=".glb,.gltf" style="display:none">
	<button id="clearModelBtn" onclick="clearUploadedModel()">🗑 清除上传模型</button>
	<button id="uploadSmearBtn">📷 上传本细胞涂片<span class="local-tag">（仅本机）</span></button>
	<input id="smearFile" type="file" accept="image/png,image/jpeg,image/webp" style="display:none">
	<button id="clearSmearBtn">🗑 清除涂片</button>
	<div style="font-size:9px;color:#6b7280;margin:6px 2px 2px;line-height:1.4;">📁 文件夹模型：放入 <code>models/key.glb</code><br>📁 文件夹涂片：放入 <code>images/key.jpg</code></div>
	<!-- 细胞列表由JS动态生成 -->
  </div>
  <div class="viewer">
	<div id="threeContainer"></div>
	<div id="labelLayer"></div>
	<div class="mode-label" id="modeLabel">立体模式</div>

	<div id="quizPanel">
	  <button id="quizClose" onclick="exitQuiz()">✕</button>
	  <h3 id="quizTitle">📋 测验模式</h3>
	  <div id="quizProgress">1 / 5</div>
	  <div id="quizCellName"></div>
	  <div id="quizOptions"></div>
	  <div id="quizResult"></div>
	</div>

	<div id="labelDetail">
	  <span class="close" onclick="hideLabelDetail()">✕</span>
	  <h4 id="detailName"></h4>
	  <p id="detailInfo"></p>
	  <div id="detailFoot"></div>
	</div>

	<div id="hwBadge" onclick="hwBadgeClick(event)">
	  <span class="hw-x" onclick="collapseHwBadge(event)" title="收起成小图标（点击图标可恢复）">✕</span>
	  <div class="hw-name" id="hwName"></div>
	  <div class="hw-sub" id="hwSub"></div>
	</div>
  </div>
  <div class="info">
	<h3 id="cellName">—</h3>
	<div id="cellTags"></div>
	<p id="cellDesc"></p>
	<div class="dim" id="dimensionPanel" style="display:none;"></div>
	<div class="sec morph"><div class="sec-h" id="secMorphH">🔍 形态特征</div><div class="sec-b" id="txtMorph"></div></div>
	<div class="sec stain"><div class="sec-h" id="secStainH">🎨 染色特点</div><div class="sec-b" id="txtStain"></div></div>
	<div class="sec diff"><div class="sec-h" id="secDiffH">⚖️ 鉴别要点</div><div class="sec-b" id="txtDiff"></div></div>
	<div class="sec clin"><div class="sec-h" id="secClinH">🏥 临床意义</div><div class="sec-b" id="txtClin"></div></div>
	<div class="sec case"><div class="sec-h" id="secCaseH">🩺 病例示例</div><div class="sec-b" id="txtCase"></div><div class="lab-note" id="caseNote"></div></div>
	<div class="sec lab"><div class="sec-h" id="secLabH">⚗️ 检验操作注意点</div><div class="sec-b" id="txtLab"></div></div>
	<div class="smear">
	  <h4 data-i18n="smear_title">📷 显微镜镜下观</h4>
	  <div id="smearBox"></div>
	  <div class="note" id="smearNote"></div>
	</div>
  </div>
</div>

<div class="bottom">
  <button onclick="toggleRotate()" id="rotateBtnBottom" class="active">🔄 自动旋转</button>
  <button onclick="resetView()">↺ 重置视角</button>
</div>

<script>
window.onerror = function(msg, url, line, col, error) {
  var banner = document.getElementById('errBanner');
  if(banner){ banner.style.display = 'block'; banner.textContent = 'JS错误: ' + msg + ' (行号:' + line + ')'; }
  console.error('JS Error:', msg, 'Line:', line, error);
};

  en:{sec_case:"🩺 Case vignette",sec_lab:"⚗️ Lab notes",case_note:"※ Cases are teaching vignettes with simplified, integrated data; they do not represent real patients and must not be used for diagnosis or treatment.",sec_morph:"🔍 Morphology",sec_stain:"🎨 Staining",sec_diff:"⚖️ Differential",sec_clin:"🏥 Clinical",size_label:"📏 Size",nc_label:"🧬 Nucleus",ref_label:"📊 Reference",app_title:"🩸 Blood Cell 3D v18", app_sub:"16 cells·draggable labels·ZH/EN·microscopic·quiz·folder models·custom smears·cases & lab notes",mode_smear:"🔬 Smear", mode_3d:"🧊 3D", labels_on:"🏷 Labels", labels_off:"🏷 Hide",rotate_on:"🔄 Auto-rotate", rotate_off:"▶ Rotate", reset_view:"↺ Reset",smear_title:"📷 Microscopic view", grp_peripheral:"Peripheral", grp_marrow:"Marrow", grp_gran:"Granulocytic", grp_path:"Pathology",no_img:"📷 No smear image",quiz_title:"📋 Quiz Mode",quiz_correct:"✅ Correct!",quiz_wrong:"❌ Wrong!",quiz_score:"🎉 Score:",quiz_restart:"Play Again",quiz_exit:"Exit",quiz_select:"Select:",detail_size:"📏 Size:",detail_morph:"🔍 Morph:",detail_clin:"🏥 Clinical:",upload_ok:"✅ Model loaded",upload_fail:"❌ Load failed",model_cleared:"Default model restored",smear_uploaded:"✅ Smear uploaded",smear_cleared:"Default smear restored",folder_model_loaded:"📁 Folder model loaded",folder_smear_loaded:"📁 Folder smear loaded"},
};

/* ==================================================================
   ✏️  作业署名标识配置 —— 只改下面 4 行即可
   ==================================================================
   name   : 姓名（必填）
   sid    : 学号
   klass  : 班级
   course : 课程名
   show   : true 显示标识；false 完全不显示
   某一项不需要就设成 ''，会自动隐藏、不留多余分隔符

  name:   '周卓文',
  sid:    '12026070502099',
  klass:  '26级专升本检验二班',
  course: '形态学诊断',

function hwJoin(arr){
  return arr.filter(function(x){return String(x||'').trim();})
			.map(function(x){return String(x).trim();})
			.join('　·　');
}
function buildHwBadge(){
  var box = document.getElementById('hwBadge');
  if(!box) return;
  if(!HW_BADGE.show){ box.style.display='none'; return; }
  var nm = document.getElementById('hwName');
  var sb = document.getElementById('hwSub');
  var main = hwJoin([HW_BADGE.name, HW_BADGE.sid]);
  var sub  = hwJoin([HW_BADGE.klass, HW_BADGE.course]);
  if(nm) nm.textContent = main;
  if(sb){ sb.textContent = sub; sb.style.display = sub ? '' : 'none'; }
  box.classList.remove('hidden');
  box.style.display = main ? '' : 'none';
}
function collapseHwBadge(e){
  if(e){ e.stopPropagation(); }
  var box = document.getElementById('hwBadge');
  if(box){ box.classList.add('collapsed'); box.title = '点击展开署名'; }
}
function expandHwBadge(){
  var box = document.getElementById('hwBadge');
  if(box && HW_BADGE.show){ box.classList.remove('collapsed'); box.title = ''; }
}
function hwBadgeClick(e){
  // 点击折叠后的小图标即恢复展开
  var box = document.getElementById('hwBadge');
  if(box && box.classList.contains('collapsed')) expandHwBadge();
}
// 兼容旧命名
function hideHwBadge(){ collapseHwBadge(); }
function showHwBadge(){ expandHwBadge(); }

// ---- IndexedDB for custom models (本机上传，优先级2) ----
function openModelDB(){
  return new Promise(function(res){
	var req=indexedDB.open('blood3d_models',1);
	req.onupgradeneeded=function(){ req.result.createObjectStore('glb',{keyPath:'key'}); };
	req.onsuccess=function(){res(req.result);};
	req.onerror=function(){res(null);};
  });
}
function saveUploadedModel(key,file){
  file.arrayBuffer().then(function(buf){
	openModelDB().then(function(db){
	  if(!db) return;
	  var tx=db.transaction('glb','readwrite');
	  tx.objectStore('glb').put({key:key,buf:buf,name:file.name});
	  var cb=document.getElementById('clearModelBtn'); if(cb) cb.style.display='block';
	});
  });
}
function getUploadedModel(key){
  return openModelDB().then(function(db){
	return new Promise(function(res){
	  if(!db) return res(null);
	  var tx=db.transaction('glb','readonly');
	  var r=tx.objectStore('glb').get(key);
	  r.onsuccess=function(){res(r.result?r.result.buf:null);};
	  r.onerror=function(){res(null);};
	});
  });
}
function deleteUploadedModel(key){
  return openModelDB().then(function(db){
	return new Promise(function(res){
	  if(!db) return res();
	  var tx=db.transaction('glb','readwrite');
	  tx.objectStore('glb').delete(key);
	  tx.oncomplete=function(){res();};
	});
  });
}
function checkHasCustomModel(key){
  getUploadedModel(key).then(function(buf){
	var cb=document.getElementById('clearModelBtn'); if(cb) cb.style.display = buf ? 'block' : 'none';

}

// ---- GLB Loading ----
function loadUploadedGLB(key, file){
  var url = URL.createObjectURL(file);
  gltfLoader.load(url, function(gltf){
	URL.revokeObjectURL(url);
	var model = gltf.scene;
	model.updateMatrixWorld(true);
	var box = new THREE.Box3().setFromObject(model);
	var center = box.getCenter(new THREE.Vector3());
	var size = box.getSize(new THREE.Vector3());
	var maxd = Math.max(size.x, size.y, size.z) || 1;
	model.position.sub(center);
	var targetSize = 3;
	model.scale.setScalar(targetSize / maxd);
	if(currentMesh){scene.remove(currentMesh);clearObj(currentMesh);}
	currentMesh = model;
	scene.add(currentMesh);
	frameCurrentCell();
	saveUploadedModel(key, file);
	showLoading(false);
	showBanner(i18n[lang].upload_ok, '#4CAF50');
  }, undefined, function(err){
	URL.revokeObjectURL(url);
	showLoading(false);
	showBanner(i18n[lang].upload_fail, '#f44336');
	console.error(err);
  });
}
function parseGLBFromBuffer(key, buf){
  return new Promise(function(resolve, reject){
	gltfLoader.parse(buf, '', function(gltf){
	  var model = gltf.scene;
	  model.updateMatrixWorld(true);
	  var box = new THREE.Box3().setFromObject(model);
	  var center = box.getCenter(new THREE.Vector3());
	  var size = box.getSize(new THREE.Vector3());
	  var maxd = Math.max(size.x, size.y, size.z) || 1;
	  model.position.sub(center);
	  var targetSize = 3;
	  model.scale.setScalar(targetSize / maxd);
	  resolve(model);
	}, reject);
  });
}

// ---- 拖拽自转 ----
let cellDragging = false;
let cellDragAccum = { x: 0, y: 0 };
let cellPrevMouse = { x: 0, y: 0 };
let _dragTimer = null;
const cellRaycaster = new THREE.Raycaster();
const _activePointers = new Set();

function initThree(){
  var c=document.getElementById('threeContainer');
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45,c.clientWidth/c.clientHeight,0.1,1000);
  camera.position.set(0,0,7);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(c.clientWidth,c.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  if(renderer.outputColorSpace!==undefined) renderer.outputColorSpace=THREE.SRGBColorSpace;
  c.appendChild(renderer.domElement);

  renderer.domElement.style.touchAction = 'none';
  renderer.domElement.addEventListener('touchmove', function(e) {
	if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  try {
	if (typeof THREE.CSS2DRenderer !== 'undefined') {
	  labelRenderer=new THREE.CSS2DRenderer();
	  labelRenderer.setSize(c.clientWidth,c.clientHeight);
	  labelRenderer.domElement.style.position='absolute';
	  labelRenderer.domElement.style.top='0';
	  labelRenderer.domElement.style.left='0';
	  labelRenderer.domElement.style.pointerEvents='none';
	  document.getElementById('labelLayer').appendChild(labelRenderer.domElement);
	} else { showLabels = false; }
  } catch(e) { showLabels = false; }

  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableRotate=true; controls.enableZoom=true; controls.enablePan=true;
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.minDistance=1.2; controls.maxDistance=80;
  controls.autoRotate=autoRotate; controls.autoRotateSpeed=1.6;
  if(THREE.TOUCH) controls.touches={ONE:THREE.TOUCH.ROTATE, TWO:THREE.TOUCH.DOLLY_PAN};

  hemi=new THREE.HemisphereLight(0xffffff,0x404050,1.0);
  keyL=new THREE.DirectionalLight(0xffffff,1.3); keyL.position.set(5,6,6);
  fillL=new THREE.DirectionalLight(0xffffff,0.5); fillL.position.set(-5,-3,-4);
  smear1=new THREE.DirectionalLight(0xffffff,0.95); smear1.position.set(0,0,6);
  smear2=new THREE.DirectionalLight(0xfff3f3,0.35); smear2.position.set(0,2,3);
  scene.add(hemi,keyL,fillL,smear1,smear2);
  applyLights();

  gltfLoader = new THREE.GLTFLoader();

  function startCellDrag(e){
	if(!currentMesh) return false;
	var rect = renderer.domElement.getBoundingClientRect();
	var ndc = new THREE.Vector2(
	  ((e.clientX-rect.left)/rect.width)*2-1,
	  -((e.clientY-rect.top)/rect.height)*2+1
	);
	cellRaycaster.setFromCamera(ndc,camera);
	var meshes=[]; currentMesh.updateMatrixWorld(true);
	currentMesh.traverse(function(o){ if(o.isMesh) meshes.push(o); });
	var hits=cellRaycaster.intersectObjects(meshes,false);
	if(hits.length>0){
	  cellDragging=true; if(controls) controls.enabled=false;
	  cellPrevMouse={x:e.clientX,y:e.clientY};
	  cellDragAccum={x:0,y:0};
	  if(controls) controls.autoRotate=false;
	  clearTimeout(_dragTimer);
	  _dragTimer=setTimeout(endCellDrag,2500);
	  return true;
	}
	return false;
  }
  function endCellDrag(){
	if(!cellDragging && _activePointers.size===0) return;
	cellDragging=false; clearTimeout(_dragTimer);
	if(controls){ controls.enabled=true; controls.autoRotate=autoRotate; controls.update(); }
  }

  renderer.domElement.addEventListener('pointerdown',function(e){
	_activePointers.add(e.pointerId);
	if(_activePointers.size>=2){ cellDragging=false; if(controls){controls.enabled=true;controls.autoRotate=false;} return; }
	if(e.pointerType==='touch' || (e.pointerType==='mouse'&&e.button===0)){
	  var ok=startCellDrag(e);
	  if(ok) e.preventDefault();
	  else if(controls){ controls.enabled=true; }
	}
  });
  renderer.domElement.addEventListener('pointermove',function(e){
	if(_activePointers.size>=2){ endCellDrag(); return; }
	if(!cellDragging) return;
	var dx=e.clientX-cellPrevMouse.x, dy=e.clientY-cellPrevMouse.y;
	cellDragAccum.y += dx*0.008; cellDragAccum.x += dy*0.008;
	cellPrevMouse={x:e.clientX,y:e.clientY};
  });
  function onPtrUp(e){
	_activePointers.delete(e.pointerId);
	if(_activePointers.size<2) endCellDrag();
  }
  renderer.domElement.addEventListener('pointerup',onPtrUp);
  renderer.domElement.addEventListener('pointercancel',onPtrUp);
  renderer.domElement.addEventListener('pointerleave',function(e){ _activePointers.delete(e.pointerId); endCellDrag(); });

  animate();
  window.addEventListener('resize',function(){
	camera.aspect=c.clientWidth/c.clientHeight; camera.updateProjectionMatrix();
	renderer.setSize(c.clientWidth,c.clientHeight);
	if(labelRenderer) labelRenderer.setSize(c.clientWidth,c.clientHeight);
  });
}

function animate(){
  requestAnimationFrame(animate);
  if (currentMesh) {
	if (cellDragging) {
	  currentMesh.rotation.x += cellDragAccum.x;
	  currentMesh.rotation.y += cellDragAccum.y;
	  cellDragAccum.x = 0; cellDragAccum.y = 0;
	} else if (autoRotate && controls && !controls.autoRotate) {
	  currentMesh.rotation.y += 0.005;
	}
  }
  if(controls) controls.update();
  renderer.render(scene,camera);
  if(showLabels && labelRenderer) labelRenderer.render(scene,camera);
}

function applyLights(){var m=mode==='smear';hemi.visible=!m;keyL.visible=!m;fillL.visible=!m;smear1.visible=m;smear2.visible=m;}

function mat(color,opt){
  if(mode==='smear') return new THREE.MeshLambertMaterial(Object.assign({color:new THREE.Color(color)},opt));
  return new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(color),roughness:0.6,metalness:0},opt));
}
function rnd(R){var v;do{v=new THREE.Vector3(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1);}while(v.length()>1);return v.multiplyScalar(R);}
function clearObj(g){scene.remove(g);g.traverse(function(o){if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose();}});}

function createDraggableLabel(text, position3D, labelId) {
  if (!labelRenderer || typeof THREE.CSS2DObject === 'undefined') return null;
  try {
	var div = document.createElement('div');
	div.className = 'tag3d'; div.textContent = text;
	div.style.pointerEvents = 'auto';
	var dragOffset = { x: 0, y: 0 };
	var label = new THREE.CSS2DObject(div);
	label.position.copy(position3D);
	scene.add(label);
	var dragging = false, startP = {x:0,y:0}, startOff = {x:0,y:0};
	var clickStartTime = 0, startPos = {x:0,y:0};
	div.addEventListener('pointerdown', function(e) {
	  e.stopPropagation(); dragging = true; div.classList.add('drag');
	  div.setPointerCapture(e.pointerId);
	  startP = { x: e.clientX, y: e.clientY }; startOff = { x: dragOffset.x, y: dragOffset.y };
	  clickStartTime = Date.now(); startPos = { x: e.clientX, y: e.clientY };
	});
	div.addEventListener('pointermove', function(e) {
	  if (!dragging) return;
	  dragOffset.x = startOff.x + (e.clientX - startP.x);
	  dragOffset.y = startOff.y + (e.clientY - startP.y);
	  div.style.transform = 'translate(calc(-50% + '+dragOffset.x+'px), calc(-50% + '+dragOffset.y+'px))';
	});
	div.addEventListener('pointerup', function(e) {
	  dragging = false; div.classList.remove('drag'); div.releasePointerCapture(e.pointerId);
	  var dt = Date.now() - clickStartTime;
	  var dist = Math.hypot(e.clientX - startPos.x, e.clientY - startPos.y);
	  if (dt < 300 && dist < 8) showLabelDetail(labelId, text);
	});
	currentLabels.push({ label: label, div: div });
	return label;
  } catch(e) { return null; }
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var SOFT_BREAK = /(判读：|要点：|提醒：|对照：|Interpretation:|Contrast:|Remember|Key point:|判読：)/;
function renderRich(el, text, soft){
  if(!el) return;
  if(!text){ el.innerHTML=''; if(el.parentNode) el.parentNode.style.display='none'; return; }
  var parts = String(text).split(/(?=[\u2460-\u2473])/).filter(function(p){return p.trim();});
  var html = '';
  if(parts.length>1 && !/^[\u2460-\u2473]/.test(parts[0].trim())){
	html += '<div class="nl-lead">'+escHtml(parts.shift().trim())+'</div>';
  }
  if(parts.length>1){
	html += parts.map(function(p){return '<div class="nl">'+escHtml(p.trim())+'</div>';}).join('');
  } else {
	var flat = parts.join('');
	var seg = soft ? flat.split(SOFT_BREAK) : [flat];
	if(seg.length>1){
	  var buf=[];
	  for(var i=0;i<seg.length;i++){
		if(i>0 && SOFT_BREAK.test(seg[i])) buf.push(seg[i]);
		else if(i>0) buf[buf.length-1]+=seg[i];
		else buf.push(seg[i]);
	  }
	  html += buf.map(function(p){return '<div class="nl-flat">'+escHtml(p.trim())+'</div>';}).join('');
	} else html += escHtml(flat);
  }
  el.innerHTML = html;
  if(el.parentNode) el.parentNode.style.display='';
}

function lobed(pts,r,color){var g=new THREE.Group();var m=mat(color);pts.forEach(function(p){var s=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),m);s.position.set(p[0],p[1],p[2]);g.add(s);});return g;}
function rod(x,y,z,rot,r,len){var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,12),mat(0x6a2f8f));m.position.set(x,y,z);m.rotation.z=rot;return m;}

		var d = Math.hypot(x, z);
		if(d < 1.2){ var indent = Math.cos(d * Math.PI / 2.4) * 0.62; y2 -= indent * (y >= 0 ? 1 : -1); }
		pos.setXYZ(i, x, y2, z);
	  }
	  geo.computeVertexNormals();

function frameCurrentCell(){
  if(!currentMesh||!controls) return;
  currentMesh.updateMatrixWorld(true);
  var box=new THREE.Box3().setFromObject(currentMesh);
  if(box.isEmpty()) return;
  var center=box.getCenter(new THREE.Vector3());
  var size=box.getSize(new THREE.Vector3());
  var maxd=Math.max(size.x,size.y,size.z)||1;
  if(!isFinite(maxd)||maxd<=0) return;
  var r=maxd/2; var fov=camera.fov*Math.PI/180;
  var dist=(r/Math.sin(fov/2))*1.5;
  dist=Math.min(Math.max(dist,controls.minDistance),controls.maxDistance);
  camera.position.set(center.x,center.y,center.z+dist);
  controls.target.copy(center);
  camera.near=Math.max(0.05,dist-r*0.5); camera.far=dist+r*8;
  camera.updateProjectionMatrix(); controls.update();
}

function toggleRotate(){
	autoRotate = !autoRotate;
  if(controls) controls.autoRotate = autoRotate;
  var topBtn = document.getElementById('btnRotateTop');
  var botBtn = document.getElementById('rotateBtnBottom');
  if (autoRotate) { if(topBtn)topBtn.classList.add('active'); if(botBtn)botBtn.classList.add('active'); }
  else { if(topBtn)topBtn.classList.remove('active'); if(botBtn)botBtn.classList.remove('active'); }
  var zh = (lang === 'zh');
  var txt = zh ? (autoRotate ? '🔄 自动旋转' : '▶ 开始旋转') : (autoRotate ? '🔄 Auto-rotate' : '▶ Rotate');
  if(topBtn) topBtn.textContent = txt;
  if(botBtn) botBtn.textContent = txt;
}
function syncSpeechBtn(){
  var b = document.getElementById('btnSpeech');
  if(!b) return;
  b.classList.toggle('active', speechOn);
  b.textContent = speechOn ? (lang==='zh' ? '🔊 语音' : '🔊 Speech') : (lang==='zh' ? '🔇 静音' : '🔇 Muted');
  b.title = speechOn ? (lang==='zh' ? '语音播报已开启，点击关闭' : 'Speech on - click to mute')
					 : (lang==='zh' ? '语音播报已关闭，点击开启' : 'Speech off - click to enable');
}

// ========== 核心：文件夹模型优先加载 ==========
function loadModelFromFolder(key, td) {
  var exts = ['.glb', '.gltf'];
  function tryLoad(idx) {
	if (idx >= exts.length) {
	  getUploadedModel(key).then(function(buf){
		if(buf){
		  parseGLBFromBuffer(key, buf).then(function(model){
			if(currentMesh){scene.remove(currentMesh);clearObj(currentMesh);}
			currentMesh=model; scene.add(currentMesh); frameCurrentCell();
			if(showLabels){clearLabels();Object.entries(td.labels).forEach(function(entry){createDraggableLabel(entry[1],getAnchor(key,entry[0]),entry[0]);});}
		  });
		} else {
		  fallbackToBuildCell(key, td);
		}
	  });
	  return;
	}
	var path = './models/' + key + exts[idx];
	gltfLoader.load(path,
	  function(gltf) {
		var model = gltf.scene;
		model.updateMatrixWorld(true);
		var box = new THREE.Box3().setFromObject(model);
		var center = box.getCenter(new THREE.Vector3());
		var size = box.getSize(new THREE.Vector3());
		var maxd = Math.max(size.x, size.y, size.z) || 1;
		model.position.sub(center);
		var targetSize = 3;
		model.scale.setScalar(targetSize / maxd);
		if(currentMesh){scene.remove(currentMesh);clearObj(currentMesh);}
		currentMesh = model;
		scene.add(currentMesh);
		frameCurrentCell();
		if(showLabels){clearLabels();Object.entries(td.labels).forEach(function(entry){createDraggableLabel(entry[1],getAnchor(key,entry[0]),entry[0]);});}
		showBanner(i18n[lang].folder_model_loaded, '#4fc3f7');
	  },
	  undefined,
	  function() { tryLoad(idx + 1); }
	);
  }
  tryLoad(0);
}

// ========== 核心：文件夹涂片优先加载 ==========
function renderSmear(key, cell, td){
  var smearKey = cell.smearKey || key;
  var box = document.getElementById('smearBox');
  if(!box) return;
  if(currentSmearURL){ URL.revokeObjectURL(currentSmearURL); currentSmearURL = null; }

  getSmear(smearKey).then(function(blob){
	if(blob){
	  currentSmearURL = URL.createObjectURL(blob);
	  box.innerHTML = '<img id="smearImg" src="'+currentSmearURL+'" alt="'+td.n+'" style="width:100%;border-radius:7px;border:1px solid #374151;min-height:110px;object-fit:cover;background:#000;">';
	  var csb=document.getElementById('clearSmearBtn'); if(csb) csb.style.display = 'block';
	  return;
	}

	var imgExts = ['.jpg', '.jpeg', '.png', '.webp'];
	function tryImg(idx) {
	  if (idx >= imgExts.length) {
		var net = smearImages[smearKey];
		if(net){
		  box.innerHTML = '<img src="'+net+'" alt="'+td.n+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="err" style="display:none;">'+i18n[lang].no_img+'</div>';
		} else {
		  box.innerHTML = '<div class="err">'+i18n[lang].no_img+'</div>';
		}
		var csb=document.getElementById('clearSmearBtn'); if(csb) csb.style.display = 'none';
		return;
	  }
	  var imgPath = './images/' + smearKey + imgExts[idx];
	  fetch(imgPath).then(function(r){
		if(r.ok) {
		  box.innerHTML = '<img src="'+imgPath+'" alt="'+td.n+'" style="width:100%;border-radius:7px;border:1px solid #374151;min-height:110px;object-fit:cover;background:#000;">';
		  showBanner(i18n[lang].folder_smear_loaded, '#66bb6a');
		} else {
		  tryImg(idx + 1);
		}
	  }).catch(function(){ tryImg(idx + 1); });
	}
	tryImg(0);
  });
}

function selectCell(key,btn,silent){
  if(quizActive && btn) return;
  hideLabelDetail();   // 切换细胞时自动关闭标注详情弹窗
  cellDragging = false; if(controls) { controls.enabled = true; controls.autoRotate = autoRotate; controls.update(); }
  clearTimeout(_dragTimer); _activePointers.clear();
  expandHwBadge();   // 切换细胞时自动恢复署名，避免收起后找不回来

  currentKey=key;
  document.querySelectorAll('.sidebar button').forEach(function(b){if(b.id!=='quizBtn'&&b.id!=='uploadModelBtn'&&b.id!=='clearModelBtn'&&b.id!=='uploadSmearBtn'&&b.id!=='clearSmearBtn')b.classList.remove('active');});
  if(btn)btn.classList.add('active');
  var cell=cells[key];if(!cell)return;
  var td=cell.t[lang];
  var quizHide=quizActive;
  var cn=document.getElementById('cellName'); if(cn)cn.textContent=quizHide?(lang==='zh'?'❓ 未知细胞':'❓ Unknown cell'):td.n;
  var cd=document.getElementById('cellDesc'); if(cd)cd.textContent=quizHide?'':td.d;
  var tagsDiv=document.getElementById('cellTags'); if(tagsDiv){tagsDiv.innerHTML='';if(!quizHide)td.tags.forEach(function(t){var s=document.createElement('span');s.className='tag';s.textContent=t;tagsDiv.appendChild(s);});}
  var dp=document.getElementById('dimensionPanel');
  if(dp){dp.style.display=quizHide?'none':'block';
	var h='<b>'+i18n[lang].size_label+'：</b>'+escHtml(td.size||cell.size);
	var ncv=td.nc||cell.nc; if(ncv) h+='<br><b>'+i18n[lang].nc_label+'：</b>'+escHtml(ncv);
	var refv=td.ref||cell.ref; if(refv) h+='<br><b>'+i18n[lang].ref_label+'：</b>'+escHtml(refv);
	dp.innerHTML=h;}

  var secIds={txtMorph:'morph',txtStain:'stain',txtDiff:'diff',txtClin:'clin',txtCase:'case',txtLab:'lab'};
  Object.keys(secIds).forEach(function(id){
	var el=document.getElementById(id); if(!el) return;
	renderRich(el, quizHide?'':(td[secIds[id]]||''), id==='txtCase');
  });
  var secHead={secMorphH:'sec_morph',secStainH:'sec_stain',secDiffH:'sec_diff',secClinH:'sec_clin',secCaseH:'sec_case',secLabH:'sec_lab'};
  var caseNote=document.getElementById('caseNote'); if(caseNote) caseNote.textContent=quizHide?'':i18n[lang].case_note;
  Object.keys(secHead).forEach(function(id){var el=document.getElementById(id); if(el) el.textContent=i18n[lang][secHead[id]];});

  renderSmear(key, cell, td);
  var sn=document.getElementById('smearNote'); if(sn)sn.textContent=quizHide?'':((td.morph||td.d).substring(0,54)+'…');

  checkHasCustomModel(key);
  loadModelFromFolder(key, td);

  if(!silent && speechOn && 'speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(td.n+td.d);u.lang=lang==='zh'?'zh-CN':'en-US';u.rate=0.85;speechSynthesis.speak(u);}
}

function fallbackToBuildCell(key,td){
  if(currentMesh){scene.remove(currentMesh);clearObj(currentMesh);}
  currentMesh=buildCell(key); scene.add(currentMesh); frameCurrentCell();
  if(showLabels){clearLabels();Object.entries(td.labels).forEach(function(entry){createDraggableLabel(entry[1],getAnchor(key,entry[0]),entry[0]);});}
}

function showLabelDetail(labelId, labelText) {
  if (quizActive) return;
  var cell = cells[currentKey]; if (!cell) return;
  var td = cell.t[lang];
  var dn=document.getElementById('detailName'); if(dn)dn.textContent = labelText;
  var info = (td.labelDetail && td.labelDetail[labelId]) ? td.labelDetail[labelId] : td.d;
  var di=document.getElementById('detailInfo'); if(di) renderRich(di, info);
  var df=document.getElementById('detailFoot');
  if(df) df.textContent = '🩸 ' + td.n + '　📏 ' + (td.size || cell.size);
  var detail = document.getElementById('labelDetail');
  if(detail){detail.style.display = 'block'; detail.style.left = '50%'; detail.style.top = '50%'; detail.style.transform = 'translate(-50%,-50%)';}
}
function hideLabelDetail() { var ld=document.getElementById('labelDetail'); if(ld)ld.style.display = 'none'; }

// ===== 点击空白处关闭标注详情弹窗 =====
(function(){
  function isInside(node, id){
    var p = document.getElementById(id);
    return !!(p && node && p.contains(node));
  }
  function onDocClick(e){
    var ld = document.getElementById('labelDetail');
    if(!ld || ld.style.display === 'none') return;
    var t = e.target;
    if(isInside(t,'labelDetail')) return;      // 弹窗内部：正常交互，不关
    if(isInside(t,'quizPanel')) return;        // 测验面板内部
    if(t && t.closest && t.closest('.tag3d')) return;  // 点的是3D标注本身
    hideLabelDetail();
  }
  // capture 阶段先注册，保证标签自身点击已完成打开后再生效
  document.addEventListener('click', onDocClick, true);
  document.addEventListener('pointerdown', function(e){
    var ld = document.getElementById('labelDetail');
    if(!ld || ld.style.display === 'none') return;
    var t = e.target;
    if(isInside(t,'labelDetail') || isInside(t,'quizPanel')) return;
    if(t && t.closest && t.closest('.tag3d')) return;
    hideLabelDetail();
  }, true);
  // Esc 键也能关闭
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') hideLabelDetail(); });
})();

// ===== 测验面板单击折叠/展开功能（已移除拖拽）=====
function toggleQuizPanelCollapse() {
  var qp = document.getElementById('quizPanel');
  if (!qp) return;
  
  if (!qp.classList.contains('collapsed')) {
	// 折叠成窄边
	qp.classList.add('collapsed');
	qp.dataset.origStyle = JSON.stringify({
	  width: qp.style.width, height: qp.style.padding,
	  left: qp.style.left, top: qp.style.top, transform: qp.style.transform,
	  borderRadius: qp.style.borderRadius, overflow: qp.style.overflow
	});
	
	qp.style.width = '12px';
	qp.style.height = '120px';
	qp.style.padding = '0';
	qp.style.borderRadius = '6px';
	qp.style.overflow = 'hidden';
	qp.style.left = 'auto';
	qp.style.right = '10px';
	qp.style.top = '50%';
	qp.style.transform = 'translateY(-50%)';
	
	// 隐藏内容
	var contents = qp.querySelectorAll('h3, #quizProgress, #quizCellName, #quizOptions, #quizResult, #quizClose, #quizPanelDragHandle');
	contents.forEach(function(el) { el.style.display = 'none'; });
	
	// 添加窄边提示
	if(!document.getElementById('quizCollapseHint')) {
	  var hint = document.createElement('div');
	  hint.id = 'quizCollapseHint';
	  hint.style.cssText = 'width:100%;height:100%;background:#ff9800;cursor:pointer;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;color:#111827;font-size:11px;font-weight:bold;border-radius:6px;';
	  hint.textContent = '测验';
	  hint.title = '单击展开';
	  hint.onclick = toggleQuizPanelCollapse;
	  qp.appendChild(hint);
	} else {
	  document.getElementById('quizCollapseHint').style.display = 'flex';
	}
  } else {
	// 展开
	qp.classList.remove('collapsed');
	var orig = qp.dataset.origStyle ? JSON.parse(qp.dataset.origStyle) : null;
	if (orig) {
	  qp.style.width = orig.width || '';
	  qp.style.height = orig.height || '';
	  qp.style.padding = orig.padding || '';
	  qp.style.left = orig.left || '';
	  qp.style.top = orig.top || '';
	  qp.style.transform = orig.transform || '';
	  qp.style.borderRadius = orig.borderRadius || '';
	  qp.style.overflow = orig.overflow || '';
	} else {
	  qp.style.width = ''; qp.style.height = ''; qp.style.padding = '';
	  qp.style.left = ''; qp.style.top = ''; qp.style.transform = '';
	  qp.style.borderRadius = ''; qp.style.overflow = '';
	}
	
	var contents = qp.querySelectorAll('h3, #quizProgress, #quizCellName, #quizOptions, #quizResult, #quizClose, #quizPanelDragHandle');
	contents.forEach(function(el) { el.style.display = ''; });
	
	var hint = document.getElementById('quizCollapseHint');
	if(hint) hint.style.display = 'none';
  }
}

// ===== Quiz =====
function startQuiz() {
  // 如果折叠了，先展开
  var qp = document.getElementById('quizPanel');
  if (qp && qp.classList.contains('collapsed')) {
	toggleQuizPanelCollapse();
  }
  
  quizActive = true; quizIndex = 0; quizScore = 0;
  var keys = Object.keys(cells); keys.sort(() => Math.random() - 0.5);
  quizCells = keys.slice(0, 5);
  var qp_el=document.getElementById('quizPanel'); if(qp_el)qp_el.style.display = 'block';
  var qt=document.getElementById('quizTitle'); if(qt)qt.textContent = i18n[lang].quiz_title;
  nextQuestion();
}
function nextQuestion() {
  if (quizIndex >= quizCells.length) { showQuizResult(); return; }
  var key = quizCells[quizIndex];
  var cell = cells[key];
  var qp_el=document.getElementById('quizProgress'); if(qp_el)qp_el.textContent = (quizIndex + 1) + ' / ' + quizCells.length;
  var qcn=document.getElementById('quizCellName'); if(qcn)qcn.textContent = '🔍 请观察3D模型并识别此细胞：';
  selectCell(key, null, true);
  var options = [key]; var keys = Object.keys(cells);
  while (options.length < 4) { var rk = keys[Math.floor(Math.random() * keys.length)]; if (!options.includes(rk)) options.push(rk); }
  options.sort(() => Math.random() - 0.5);
  var optDiv = document.getElementById('quizOptions'); if(optDiv){optDiv.innerHTML = '';}
  options.forEach(function(rk) {
	var btn = document.createElement('button'); btn.className = 'quizOpt';
	btn.textContent = cells[rk].t[lang].n;
	btn.onclick = function() { checkAnswer(btn, rk, key); };
	if(optDiv)optDiv.appendChild(btn);
  });
  var qr=document.getElementById('quizResult'); if(qr)qr.innerHTML = '';
}
function checkAnswer(btn, selectedKey, correctKey) {
  var opts = document.querySelectorAll('.quizOpt'); opts.forEach(function(o) { o.disabled = true; });
  if (selectedKey === correctKey) {
	btn.classList.add('correct'); quizScore++;
	if (speechOn && 'speechSynthesis' in window) { var u = new SpeechSynthesisUtterance(lang==='zh'?'正确':'Correct'); u.lang = lang==='zh'?'zh-CN':'en-US'; speechSynthesis.speak(u); }
  } else {
	btn.classList.add('wrong');
	opts.forEach(function(o) { if (o.textContent === cells[correctKey].t[lang].n) o.classList.add('correct'); });
	if (speechOn && 'speechSynthesis' in window) { var u = new SpeechSynthesisUtterance(lang==='zh'?'错误':'Wrong'); u.lang = lang==='zh'?'zh-CN':'en-US'; speechSynthesis.speak(u); }
  }
  setTimeout(function() { quizIndex++; nextQuestion(); }, 1500);
}
function showQuizResult() {
  var qcn=document.getElementById('quizCellName'); if(qcn)qcn.textContent = '';
  var qo=document.getElementById('quizOptions'); if(qo)qo.innerHTML = '';
  var qr=document.getElementById('quizResult'); if(qr)qr.innerHTML =
	'<h3>' + i18n[lang].quiz_score + quizScore + '/' + quizCells.length + '</h3>' +
	'<button onclick="startQuiz()" style="background:#ff9800;color:#fff;">' + i18n[lang].quiz_restart + '</button>' +
	'<button onclick="exitQuiz()" style="background:#374151;color:#fff;">' + i18n[lang].quiz_exit + '</button>';
}
function exitQuiz() {
  quizActive = false;
  var qp = document.getElementById('quizPanel');
  if (qp) {
	qp.style.display = 'none';
	qp.style.left = '50%'; qp.style.top = '50%';
	qp.style.right = 'auto'; qp.style.bottom = 'auto';
	qp.style.transform = 'translate(-50%,-50%)';
	// 如果处于折叠状态，重置它
	if(qp.classList.contains('collapsed')){
		qp.classList.remove('collapsed');
		var hint = document.getElementById('quizCollapseHint');
		if(hint) hint.remove();
	}
  }
  var qr = document.getElementById('quizResult'); if(qr)qr.innerHTML = '';
  expandHwBadge();
  selectCell(currentKey, null, true);
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', function(){
  var sidebar=document.getElementById('sidebar');
  if(sidebar){
	var groups={'peripheral':'grp_peripheral','marrow':'grp_marrow','gran':'grp_gran','path':'grp_path'};
	Object.entries(groups).forEach(function(entry){
	  var gk=entry[0], gv=entry[1];
	  var grpDiv=document.createElement('div');grpDiv.className='grp';grpDiv.setAttribute('data-i18n',gv);grpDiv.textContent=i18n[lang][gv];sidebar.appendChild(grpDiv);
	  Object.entries(cells).filter(function(c){return c[1].group===gk;}).forEach(function(c){
		var k=c[0], cell=c[1];
		var b=document.createElement('button');b.textContent=cell.t[lang].n;b.onclick=function(){selectCell(k,b);};sidebar.appendChild(b);
	  });
	});
  }

  // 绑定测验面板（移除拖拽，改为单击折叠）
  var qp = document.getElementById('quizPanel');
  if (qp) {
	var handle = document.getElementById('quizPanelDragHandle');
	if (!handle) {
	  handle = document.createElement('div');
	  handle.id = 'quizPanelDragHandle';
	  qp.insertBefore(handle, qp.firstChild);
	}
	// 禁用拖拽，改为单击事件
	handle.onclick = function(e) {
	  e.stopPropagation();
	  toggleQuizPanelCollapse();
	};
	handle.style.cursor = 'pointer';
	handle.title = '单击折叠/展开面板';
  }

  var savedLang=localStorage.getItem('lang')||'zh';
  if(savedLang!=='zh'&&savedLang!=='en') savedLang='zh';
  lang=savedLang; localStorage.setItem('lang',lang);
  var ls=document.getElementById('langSel');if(ls)ls.value=lang;
  // 语音：每次打开强制静音，清除历史偏好并终止可能残留的朗读
  speechOn = false;
  try { localStorage.removeItem('speechOn'); } catch(e) {}
  try { if('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e) {}
  syncSpeechBtn();
  buildHwBadge();
  initThree();applyI18n();
  var firstBtn=sidebar?sidebar.querySelector('button:not(#quizBtn):not(#uploadModelBtn):not(#clearModelBtn):not(#uploadSmearBtn):not(#clearSmearBtn)'):null;
  selectCell('red_blood_cell', firstBtn);
});
</script>
